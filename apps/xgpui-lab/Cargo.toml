[package]
name = "xgpui-lab"
default-run = "xgpui-lab"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Optional Waves wgpu producer outside Linux (Linux enables it by target).
waves-wgpu = ["dep:gpui-wgpu", "xgpui-shader/wgpu"]
# Opt-in app-side Metal/wgpu parity validation for the Grid sample.
grid-wgpu = ["dep:gpui-wgpu", "xgpui-shader/wgpu"]
# Headless exposition and event-log tests; does not launch XGPUI Lab.
test-support = ["xgpui-luma/test-support", "xgpui-luma-color/test-support"]
# Identifies the distributable build; embedded benchmarks remain available.
portable-app = []

[dependencies]
xgpui-shell = "0.2.0"
clap = { version = "4", features = ["derive"] }
xgpui-canvas = { version = "0.3.4", features = ["gpui"] }
log = "0.4"
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
gpui-wgpu = { package = "xgpui-wgpu", version = "2.3.0", features = ["test-support"], optional = true }
libc = "0.2"
bytemuck = { version = "1", features = ["derive"] }
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
xgpui-parley = { version = "0.5.1", features = ["system-fonts"] }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
skrifa = "=0.44.0"
unicode-segmentation = "1"
xgpui-media = { version = "0.5.4" }
xgpui-svg = { version = "0.3.4" }
tempfile = "3"
xgpui-color = { version = "0.3.2", features = ["icc"] }
xgpui-shader = { version = "0.4.4", features = ["portable-shaders"] }
xgpui-gamut = { version = "0.3.4", features = ["instanced"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
gpui = { workspace = true, features = ["profiler", "test-support"] }
xgpui-luma = { workspace = true }
xgpui-luma-color = { workspace = true }
gpui_platform = { workspace = true, features = ["font-kit", "test-support"] }
image = "0.25"
xgpui-luma-look-radix = { workspace = true }
lucide-svg-static = { package = "lucide-static-svg", version = "1.45.0" }
palette = "0.7.7"
smallvec = "1"
tiny-skia = "0.11"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui-wgpu = { package = "xgpui-wgpu", version = "2.3.0" }
# Gradient and mesh paints use the wgpu backend on Linux.
xgpui-shader = { version = "0.4.4", features = ["wgpu"] }
gtk = { version = "0.18" }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSResponder", "NSView", "NSWindow"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
gpui-apple = { package = "xgpui-apple", version = "4.1.0", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { package = "xgpui-windows", version = "2.2.0" }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
