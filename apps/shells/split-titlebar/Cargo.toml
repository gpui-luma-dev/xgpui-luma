[package]
name = "luma-shell-split-titlebar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
xgpui-luma.workspace = true
lucide-svg-static.workspace = true
gpui_platform = { workspace = true }
xgpui-luma-look-shadcn.workspace = true
luma-shell-common = { path = "../common" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView"] }
raw-window-handle = { version = "0.6.2", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
