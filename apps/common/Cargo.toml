[package]
name = "luma-app-common"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Shared demo assets for Luma apps — tweakcn CSS packs and embedded fonts. Not an SDK crate."

[lib]
name = "luma_app_common"

[features]
test-support = ["xgpui-luma/test-support"]

[dependencies]
xgpui-luma.workspace = true
xgpui-luma-color.workspace = true
anyhow = { workspace = true }
gpui = { workspace = true }
xgpui-luma-look-shadcn.workspace = true
tracing = "0.1"

[lints]
workspace = true
