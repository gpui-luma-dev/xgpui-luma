name: Release Library Crates to crates.io

# Publishes the five library crates, then tags the verified commit and creates a release.

# Manual dispatch only; verification is the default and publishing is opt-in.
on:
  workflow_dispatch:
    inputs:
      registry_only:
        description: Only check registry/version readiness (publish always runs full verification)
        type: boolean
        default: false
      publish:
        description: Publish verified crates and create the GitHub release (false verifies only)
        type: boolean
        default: false
      allow_new_crates:
        description: Allow first-time crate registration; token must grant creation and crate-name permissions
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-library-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH_RELEASE: ${{ inputs.publish }}
  ALLOW_NEW_CRATES: ${{ inputs.allow_new_crates }}
  LIB_PACKAGES: >-
    xgpui-luma
    xgpui-luma-color
    xgpui-luma-look-radix
    xgpui-luma-look-shadcn
    xgpui-luma-plot

jobs:
  publish:
    name: Verify, publish, tag, and release
    if: github.ref == 'refs/heads/main'
    # Registry checks need no native build; publishing always uses macOS and all checks.
    runs-on: ${{ inputs.registry_only && !inputs.publish && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        if: ${{ !inputs.registry_only || inputs.publish }}
        uses: Swatinem/rust-cache@v2
        with:
          # Separate these artifacts from the previous optimized verification builds.
          key: fast-verification-v1

      - name: Configure faster verification builds
        if: ${{ !inputs.registry_only || inputs.publish }}
        run: |
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          import re

          # Config overrides the workspace's explicit per-package optimization settings.
          # Keep local development profiles unchanged and include package verification.
          packages = re.findall(r'^\[profile\.dev\.package\.([A-Za-z0-9_-]+)\]$',
                                Path('Cargo.toml').read_text(), re.MULTILINE)
          config = Path(os.environ['CARGO_HOME']) / 'config.toml'
          with config.open('a') as output:
              output.write('\n[profile.dev]\nopt-level = 0\ndebug = 0\ncodegen-units = 256\n')
              for name in packages:
                  output.write(f'\n[profile.dev.package."{name}"]\nopt-level = 0\n')
          PYCONFIG

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [[ -z "${version}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          for package in ${LIB_PACKAGES}; do
            package_id="$(cargo pkgid --locked --package "$package")"
            if [[ "${package_id##*@}" != "${version}" ]]; then
              echo "${package} does not match workspace version ${version}" >&2
              exit 1
            fi
          done
          tag="v${version}"
          echo "workspace_version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Workspace version: ${version}"
          echo "Tag: ${tag}"

      - name: Reject tag if it already exists on another commit
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "${TAG}")"
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG} already points at ${existing}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

      - name: Test release failure handling
        run: python3 -B -m unittest discover -s scripts -p 'test_release.py'

      - name: Registry preflight (before any uploads)
        env:
          VERSION: ${{ steps.meta.outputs.workspace_version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 -B scripts/release.py preflight

      - name: Format check
        if: ${{ !inputs.registry_only || inputs.publish }}
        run: cargo fmt --all --check

      - name: Clippy library crates
        if: ${{ !inputs.registry_only || inputs.publish }}
        run: |
          # shellcheck disable=SC2086
          cargo clippy --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-targets --all-features

      - name: Test library crates (including inspection, headless support, and docs)
        if: ${{ !inputs.registry_only || inputs.publish }}
        run: |
          cargo test --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-features

      - name: Package and verify all library crates
        if: ${{ !inputs.registry_only || inputs.publish }}
        run: |
          set -euo pipefail
          cargo package --locked --registry crates-io \
            $(printf -- '--package %s ' ${LIB_PACKAGES})

      - name: Publish missing crates and verify contents
        if: ${{ !inputs.registry_only || inputs.publish }}
        env:
          VERSION: ${{ steps.meta.outputs.workspace_version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 -B scripts/release.py publish

      - name: Build source archive
        if: inputs.publish
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="xgpui-luma-${TAG}/" -o "dist/xgpui-luma-${TAG}.tar.gz" "${GITHUB_SHA}"
          shasum -a 256 "dist/xgpui-luma-${TAG}.tar.gz" | tee "dist/xgpui-luma-${TAG}.tar.gz.sha256"
          cat > dist/manifest.json <<EOF
          {
            "version": "${{ steps.meta.outputs.workspace_version }}",
            "tag": "${TAG}",
            "commit": "${GITHUB_SHA}",
            "packages": [
              "xgpui-luma",
              "xgpui-luma-color",
              "xgpui-luma-look-radix",
              "xgpui-luma-look-shadcn",
              "xgpui-luma-plot"
            ],
            "distribution": "crates.io"
          }
          EOF
          cat dist/manifest.json

      - name: Create annotated tag
        if: inputs.publish
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.workspace_version }}
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          ## ${VERSION}

          The five library crates are published on crates.io.

          \`\`\`sh
          cargo add xgpui-luma@${VERSION}
          cargo add xgpui-luma-look-shadcn@${VERSION}
          # Or: cargo add xgpui-luma-look-radix@${VERSION}
          # Optional: cargo add xgpui-luma-color@${VERSION}
          # Optional: cargo add xgpui-luma-plot@${VERSION}
          cargo add gpui-unofficial --rename gpui
          \`\`\`

          Imports use \`xgpui_luma\`, \`xgpui_luma_look_shadcn\`,
          \`xgpui_luma_look_radix\`, \`xgpui_luma_color\`, and \`xgpui_luma_plot\`.

          Source: https://github.com/${{ github.repository }}/tree/${TAG}
          EOF
          flags=()
          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" \
              "dist/xgpui-luma-${TAG}.tar.gz" \
              "dist/xgpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json \
              --clobber
          else
            gh release create "${TAG}" \
              --verify-tag \
              --title "${TAG}" \
              --notes-file dist/release-notes.md \
              --generate-notes ${flags[@]+"${flags[@]}"} \
              "dist/xgpui-luma-${TAG}.tar.gz" \
              "dist/xgpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json
          fi

      - name: Release status summary
        if: always()
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          echo "Workflow result before reporting: ${RELEASE_JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.registry_only }}" == "true" && "${{ inputs.publish }}" != "true" ]]; then
            echo "Registry-only preflight: native checks and package verification were not run." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 -B scripts/release.py summary

      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary package verification files
        if: always()
        run: rm -rf -- target/package
