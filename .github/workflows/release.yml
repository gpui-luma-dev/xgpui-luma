name: Release Library Crates to crates.io

# The same Rust publisher backs this workflow and `just publish-crates`.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan candidates, dry-run available dependency roots, or publish missing versions
        type: choice
        options: [plan, dry-run, publish]
        default: plan

permissions:
  contents: read

concurrency:
  group: release-library-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LIB_PACKAGES: >-
    xgpui-luma xgpui-luma-color xgpui-luma-look-radix
    xgpui-luma-look-shadcn xgpui-luma-plot

jobs:
  publish:
    name: Plan, verify, or publish library crates
    # Verify any selected branch; keep publication restricted to main.
    if: inputs.mode != 'publish' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test release failure and resume handling
        run: cargo test --locked -p luma-release
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint release tool
        run: cargo clippy --locked -p luma-release --all-targets -- -D warnings
      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          package_id=$(cargo pkgid --locked -p xgpui-luma)
          version=${package_id##*@}
          framework_id=$(cargo pkgid --locked -p xgpui)
          echo "workspace_version=$version" >> "$GITHUB_OUTPUT"
          echo "framework_version=${framework_id##*@}" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Reject conflicting release tag
        if: inputs.mode == 'publish'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          fi
      - name: Clippy library crates
        if: inputs.mode != 'plan'
        run: |
          cargo clippy --locked -p xgpui-luma -p xgpui-luma-color \
            -p xgpui-luma-look-radix -p xgpui-luma-look-shadcn -p xgpui-luma-plot \
            --all-targets --all-features -- -D warnings
      - name: Test library crates and documentation
        if: inputs.mode != 'plan'
        run: |
          cargo test --locked -p xgpui-luma -p xgpui-luma-color \
            -p xgpui-luma-look-radix -p xgpui-luma-look-shadcn -p xgpui-luma-plot \
            --all-features --no-fail-fast
      - name: Plan or dry-run without upload credentials
        if: inputs.mode != 'publish'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: >-
          cargo run --locked -p luma-release --bin luma-release --
          --mode "$RELEASE_MODE" --out "$RUNNER_TEMP/luma-release"
      - name: Publish missing versions and verify registry contents
        if: inputs.mode == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: >-
          cargo run --locked -p luma-release --bin luma-release --
          --mode publish --out "$RUNNER_TEMP/luma-release"

      - name: Build source archive
        if: inputs.mode == 'publish'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="xgpui-luma-${TAG}/" -o "dist/xgpui-luma-${TAG}.tar.gz" "${GITHUB_SHA}"
          shasum -a 256 "dist/xgpui-luma-${TAG}.tar.gz" | tee "dist/xgpui-luma-${TAG}.tar.gz.sha256"
          cat > dist/manifest.json <<EOF
          {
            "version": "${{ steps.meta.outputs.workspace_version }}",
            "tag": "${TAG}",
            "commit": "${GITHUB_SHA}",
            "packages": [
              "xgpui-luma",
              "xgpui-luma-color",
              "xgpui-luma-look-radix",
              "xgpui-luma-look-shadcn",
              "xgpui-luma-plot"
            ],
            "distribution": "crates.io"
          }
          EOF
          cat dist/manifest.json

      - name: Create annotated tag
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TAG}"
            gh auth setup-git
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.workspace_version }}
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          ## ${VERSION}

          The five library crates are published on crates.io.

          \`\`\`sh
          cargo add xgpui-luma@${VERSION}
          cargo add xgpui-luma-look-shadcn@${VERSION}
          # Or: cargo add xgpui-luma-look-radix@${VERSION}
          # Optional: cargo add xgpui-luma-color@${VERSION}
          # Optional: cargo add xgpui-luma-plot@${VERSION}
          cargo add xgpui@${{ steps.meta.outputs.framework_version }} --rename gpui
          \`\`\`

          Imports use \`xgpui_luma\`, \`xgpui_luma_look_shadcn\`,
          \`xgpui_luma_look_radix\`, \`xgpui_luma_color\`, and \`xgpui_luma_plot\`.

          Source: https://github.com/${{ github.repository }}/tree/${TAG}
          EOF
          flags=()
          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" \
              "dist/xgpui-luma-${TAG}.tar.gz" \
              "dist/xgpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json \
              --clobber
          else
            gh release create "${TAG}" \
              --verify-tag \
              --title "${TAG}" \
              --notes-file dist/release-notes.md \
              --generate-notes ${flags[@]+"${flags[@]}"} \
              "dist/xgpui-luma-${TAG}.tar.gz" \
              "dist/xgpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json
          fi

      - name: Preserve per-crate reports, logs, and prepared archives
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/luma-release/
          if-no-files-found: warn
          retention-days: 30
