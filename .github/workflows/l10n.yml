name: Localization core

# Keep checks opt-in, matching the repository's manual workflow policy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -p xgpui-luma-l10n --check
      - name: Lint headless tools
        run: cargo clippy -p xgpui-luma-l10n --no-default-features --features build-support,formatting --all-targets --locked -- -D warnings
      - name: Test resource checks, formatting, and generated consumer
        run: cargo test -p xgpui-luma-l10n --no-default-features --features build-support,formatting --locked
      - name: Check independent formatting features
        run: |
          for feature in format-numbers format-percent format-duration format-datetime format-lists; do
            cargo check -p xgpui-luma-l10n --no-default-features --features "$feature" --locked
          done
      - name: Test runtime without build tooling
        run: cargo test -p xgpui-luma-l10n --no-default-features --locked
      - name: Test SDK adapter and embedded SDK resource contracts
        run: cargo test -p xgpui-luma-l10n --no-default-features --features sdk,test-support,build-support --locked
      - name: Check Lab resource contracts
        run: >-
          cargo run -p xgpui-luma-l10n --no-default-features --features build-support
          --bin luma-l10n-check --locked --
          --reference apps/xgpui-lab/locales/en/lab.ftl
          --locale de=apps/xgpui-lab/locales/de/lab.ftl
          --locale ja=apps/xgpui-lab/locales/ja/lab.ftl
          --locale ar=apps/xgpui-lab/locales/ar/lab.ftl
          --used apps/xgpui-lab/locales/used-ids.txt
      - name: Check Lab source catalog inventory
        run: |
          cargo run -p lab-copy-catalog --locked -- /tmp/lab-copy.json
          python3 scripts/update_lab_copy.py /tmp/lab-copy.json --check
