[workspace]
resolver = "2"
members = [
  "tools/release",
  "apps/xgpui-lab",
  "apps/docs-embed",
  "apps/sdk-perf",
  "crates/sdk",
  "crates/luma-color",
  "crates/look-shadcn",
  "crates/look-radix",
  "crates/plot",
  "apps/common",
  "apps/luma-studio",
  "apps/radix-studio",
  "apps/luma-plot-viz",
  "apps/neumorphic-demo",
  "apps/shells/common",
  "apps/shells/detached",
  "apps/shells/split-titlebar",
  "apps/shells/vscode",
  "apps/shells/shell-2026",
]
default-members = [
  "crates/sdk",
  "crates/luma-color",
  "crates/look-shadcn",
  "crates/look-radix",
  "crates/plot",
]

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gpui-luma-dev/xgpui-luma"
homepage = "https://xgpui-luma.dev"
publish = false

[workspace.dependencies]
fasteval = { version = "0.2.4", default-features = false }
anyhow = "1"
xgpui-luma = { version = "1.0.2", path = "crates/sdk" }
xgpui-luma-color = { version = "1.0.2", path = "crates/luma-color" }
xgpui-luma-look-shadcn = { version = "1.0.2", path = "crates/look-shadcn" }
xgpui-luma-look-radix = { version = "1.0.2", path = "crates/look-radix" }
xgpui-luma-plot = { version = "1.0.2", path = "crates/plot" }
luma-app-common = { path = "apps/common" }
# Published libraries accept compatible xgpui 3.x releases; Cargo.lock pins local validation.
gpui = { package = "xgpui", version = "3.2.0" }
lucide-svg-static = { package = "lucide-static-svg", version = "1.45.0" }
gpui_platform = {
  package = "xgpui-platform",
  version = "2.0.4",
  features = ["font-kit"],
}
image = "0.25"
serde = "1"
smallvec = "1"
tiny-skia = "0.11"
toml = "0.8"
palette = "0.7.7"
font-kit = { version = "0.14.1-zed", package = "zed-font-kit" }
thiserror = "2"

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.xgpui-luma]
opt-level = 2

[profile.dev.package.luma-studio]
opt-level = 1

[profile.dev.package.luma-neumorphic-demo]
opt-level = 1

[profile.dev.package.luma-radix-studio]
opt-level = 1

[profile.dev.package.luma-shell-detached]
opt-level = 1

[profile.dev.package.luma-shell-split-titlebar]
opt-level = 1

[profile.dev.package.luma-shell-2026]
opt-level = 1

[profile.dev.package.luma-shell-vscode]
opt-level = 1

[profile.dev.package.xgpui]
opt-level = 3

[profile.dev.package.xgpui-platform]
opt-level = 3

[profile.dev.package.smol]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

# resvg hands drawing to tiny-skia and parsing to usvg; optimize them too so debug SVG
# benchmarks run near release speed (unoptimized, they were about 22x slower).
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

# Enable cross-crate optimization for shipped applications while preserving panic unwinding.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.xgpui-lab]
opt-level = 1

[profile.dev.package.xgpui-shader]
opt-level = 3

[profile.dev.package.xgpui-apple]
opt-level = 3

[profile.dev.package.naga]
opt-level = 3

[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.lyon_path]
opt-level = 3

[profile.dev.package.lyon_geom]
opt-level = 3
